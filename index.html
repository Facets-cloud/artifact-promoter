<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifact Promoter — Test Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
    }
    .topbar {
      background: #1a1a2e;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .topbar strong { font-size: 16px; }
    .dev-note {
      background: #fffbeb;
      border-bottom: 2px solid #fde68a;
      color: #92400e;
      padding: 10px 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    artifact-promoter {
      display: block;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>🚀</span>
    <strong>Artifact Promoter</strong>
    <span style="color:#94a3b8;">— Local Test Page</span>
  </div>
  <div class="dev-note">
    ⚠ <strong>Note:</strong> API calls require a valid Facets session cookie.
    Test this page within the Facets platform or behind an authenticated proxy.
    Direct access will return 401/403 from the Control Plane API.
  </div>
  <artifact-promoter></artifact-promoter>
  <script src="artifact-promoter.js"></script>
</body>
</html>
